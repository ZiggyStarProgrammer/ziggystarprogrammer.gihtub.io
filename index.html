<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZiggyStarProgrammer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom, #0a0f1c, #020617);
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    /* Star field */
    .star {
      position: fixed;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 3s infinite;
      z-index: 0; /* behind the card */
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.8; }
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 1.5rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      z-index: 1; /* above stars */
      position: relative;
    }

    img.avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1rem;
      border: 3px solid #38bdf8;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0.5rem 0;
    }

    p {
      font-size: 1rem;
      margin: 0.5rem 0 1.5rem;
      color: #cbd5e1;
    }

    .links a {
      display: block;
      margin: 0.5rem 0;
      padding: 0.8rem;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.75rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .links a:hover {
      background: #0ea5e9;
      color: #fff;
      transform: scale(1.05);
    }
    .button-container {
      position: relative;
      display: inline-block;
    }

    .accordion-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0.5rem 0;
      width: 100%;
    }

    .accordion-button {
      padding: 0.8rem 1.2rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.5s ease;
      width: 100%;
      text-align: center;
    }

    .accordion-button:hover {
      background: #0ea5e9;
    }

    .accordion-content {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
      width: 100%;
      margin-top: 0.5rem;
    }

    .accordion-content ul {
      margin: 0;
      padding-left: 20px;
    }

    .accordion-content li {
      margin: 0.3rem 0;
    }

    /* Show content on hover of container */
    .accordion-container:hover .accordion-content {
      max-height: 500px; /* large enough to show the list */
    }

    .arrow {
      display: inline-block;
      transition: transform 0.5s ease;
    }

    /* Rotate arrow when expanded */
    .accordion-container:hover .arrow {
      transform: rotate(180deg);
    }

  </style>
</head>
<body>
  <!-- Business Card -->
  <div class="card">
    <img src="https://avatars.githubusercontent.com/u/70512643?v=4" alt="Avatar" class="avatar" />
    <h1>ZiggyStarProgrammer</h1>
    <p>Developer 🖥 · Tester 🛠</p>
    <p>Automotive Sowftware Engineer / Test Engineer</p>
    <div class="accordion-container">
      <button class="accordion-button">
        About me
        <span class="arrow">▼</span>
      </button>
      <div class="accordion-content">
        <p>Coding</p>
        <p>Basketball</p>
        <p>Team player</p>
        <p>Solution oriented</p>
        <p>Gaming</p>
        <p>Skiiing</p>
      </div>
    </div>
    <div class="accordion-container">
      <button class="accordion-button">
        Skills
        <span class="arrow">▼</span>
      </button>
        <div class="accordion-content">
          <p>Python</p>
          <p>Pytest</p>
          <p>CI/CD</p>
          <p>JavaScript</p>
          <p>Linux</p>
          <p>Bash</p>
          <p>Test design</p>
          <p>Git</p>
          <p>DLT Logging</p>
          <p>ADB</p>
        </div>
    </div>
    <div class="links">
      <a href="https://github.com/ZiggyStarProgrammer" target="_blank">GitHub</a>
      <a href="mailto:hugo.develop9889@gmail.com"><i class="fas fa-envelope"></i>Email Me</a>
    </div>
  </div>

  <!-- Script to generate stars -->
  <script>
    const numStars = 80; // adjust for density
    for (let i = 0; i < numStars; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.top = Math.random() * 100 + "vh";
      star.style.left = Math.random() * 100 + "vw";
      star.style.animationDuration = (2 + Math.random() * 3) + "s";
      star.style.animationDelay = (Math.random() * 5) + "s";
      document.body.appendChild(star);
    }
  </script>
</body>
</html>
